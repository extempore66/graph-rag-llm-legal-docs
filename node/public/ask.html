<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Graph RAG — Ask</title>
<style>
  /* Same deliberate minimalism as index.html -- no framework, no build step.
     This is an internal tool and a demo surface, not a product page. */
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; color: #555; }
  .sub { color: #666; font-size: 0.9rem; margin-top: 0; }
  nav a { font-size: 0.85rem; color: #2563eb; }

  #askForm { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
  #question { flex: 1 1 420px; padding: 0.5rem; font: inherit; border: 1px solid #ccc; border-radius: 4px; }
  select, button { padding: 0.5rem 0.75rem; font: inherit; }
  button { cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 4px; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }

  .panel { border: 1px solid #e5e5e5; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .answer { font-size: 1.02rem; line-height: 1.55; white-space: pre-wrap; }

  .badge { display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.45rem; border-radius: 3px; margin-right: 0.35rem; }
  .badge-ok    { background: #dcfce7; color: #15803d; }
  .badge-warn  { background: #fef3c7; color: #b45309; }
  .badge-err   { background: #fee2e2; color: #b91c1c; }
  .badge-plain { background: #eef2ff; color: #3730a3; }

  /* The fallback banner is the single most important thing on this page.
     When graph retrieval cannot anchor, the system silently becomes vector
     search -- and a demo that hid that would be claiming credit the graph
     did not earn. Amber, not red: falling back is correct behaviour, not an
     error. */
  .fallback { border-left: 4px solid #f59e0b; background: #fffbeb; }
  .anchored { border-left: 4px solid #2563eb; background: #f8faff; }

  .kv { font-size: 0.85rem; color: #444; margin: 0.2rem 0; }
  .kv b { color: #222; font-weight: 600; }
  .family { font-size: 0.85rem; margin: 0.15rem 0 0.15rem 0.5rem; }
  .family .seed { font-weight: 600; }
  .family .variants { color: #666; }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #eee; vertical-align: top; }
  th { color: #555; font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .chan { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; color: #555; }
  /* Matches .chan so a tag in the legend is visibly the same thing as a tag
     in the table -- the whole point of a legend. */
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; color: #555; background: #f4f4f5; padding: 0.05rem 0.25rem; border-radius: 3px; }
  details summary { cursor: pointer; color: #2563eb; font-size: 0.8rem; }
  details p { white-space: pre-wrap; background: #fafafa; padding: 0.5rem; border-radius: 4px; margin: 0.4rem 0 0; font-size: 0.82rem; line-height: 1.45; }
  .muted { color: #999; }

  /* Edge evidence: the role and the words that put an entity in this passage.
     Indented under the document cell so it reads as belonging to that row, and
     quiet enough that it does not compete with the document name. */
  .ev { margin: 0.3rem 0 0 0; padding: 0 0 0 0.6rem; border-left: 2px solid #e5e7eb; list-style: none; }
  .ev li { font-size: 0.78rem; color: #555; margin: 0.15rem 0; }
  .ev .who { font-weight: 600; color: #222; }
  .ev .role { color: #3730a3; }
  .ev .quote { color: #666; font-style: italic; }
  .ev .more { color: #999; font-style: normal; }
  #status { font-size: 0.9rem; color: #666; min-height: 1.2rem; }
</style>
</head>
<body>

<h1>Graph RAG — Ask</h1>
<p class="sub">Court filings from <i>Giuffre v. Maxwell</i>, S.D.N.Y. 15-cv-07433 — 190 documents, 3,338 chunks, 2,014 resolved entities.</p>
<nav><a href="/">&larr; Ingestion / batch upload</a></nav>

<form id="askForm">
  <input id="question" type="text" list="demoQuestions"
         placeholder="e.g. What did Ghislaine Maxwell say about Virginia Giuffre?"
         autocomplete="off" />

  <!-- Demo questions, kept in sync by hand with _demo_questions.md at the
       repo root, which records WHY each one is worth asking and what to point
       at while it runs.

       A native <datalist> rather than a dropdown or any JavaScript: it costs
       nothing, cannot break, and stays out of the way. The field is still a
       free-text input -- typing anything at all works exactly as before, and
       suggestions only appear once a few characters match. The point is not
       convenience, it is not mistyping a question in front of a panel. -->
  <datalist id="demoQuestions">
    <option value="Who is Alfredo Rodriguez and what was his role in relation to Jeffrey Epstein?"></option>
    <option value="What is the obiter dicta in this case?"></option>
    <option value="Who were the defense attorneys in this case?"></option>
    <option value="Is Alan Dershowitz a defendant in this case? Why is he represented by counsel?"></option>
    <option value="What did Virginia Giuffre say about Ghislaine Maxwell and Jeffrey Epstein in her deposition?"></option>
    <option value="Which courts appear in these filings?"></option>
    <option value="Which organizations are associated with Jeffrey Epstein?"></option>
    <option value="What did the FBI do in this investigation?"></option>
  </datalist>
  <select id="strategy">
    <option value="hybrid">hybrid — 4 channels fused</option>
    <option value="graph">graph — entity traversal</option>
    <option value="naive">naive — vector only</option>
  </select>
  <button id="askBtn" type="submit">Ask</button>
</form>

<div id="status"></div>
<div id="results"></div>

<script>
const form = document.getElementById("askForm");
const questionEl = document.getElementById("question");
const strategyEl = document.getElementById("strategy");
const askBtn = document.getElementById("askBtn");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Docket filenames are long and identical up to the entry number; the prefix
// carries no information a reader of this page needs.
const shortFile = (f) => String(f).replace("gov.uscourts.nysd.447706.", "").replace(".pdf", "");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = questionEl.value.trim();
  if (!question) return;

  askBtn.disabled = true;
  resultsEl.innerHTML = "";
  statusEl.textContent = "Retrieving\u2026";
  const started = Date.now();

  // Accumulated across frames: each beat renders as it arrives, and the whole
  // view is re-rendered from this one object rather than patched in place.
  const state = { question, strategy: strategyEl.value, sources: [], graph_path: null,
                  cited_chunk_ids: [], answer: "", phase: "retrieving" };

  try {
    const res = await fetch("/ask/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, strategy: strategyEl.value }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);

    // Newline-delimited JSON. A network chunk can split a line, so the tail of
    // one read is held back and prepended to the next.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() ?? "";
      for (const line of lines) {
        if (!line.trim()) continue;
        applyFrame(state, JSON.parse(line), started);
      }
    }
  } catch (err) {
    statusEl.textContent = "";
    resultsEl.innerHTML = `<div class="panel"><span class="badge badge-err">error</span> ${esc(err.message)}</div>`;
  } finally {
    askBtn.disabled = false;
  }
});

// One frame at a time, re-rendering after each. Deltas arrive many per second,
// so the answer panel is patched directly rather than rebuilding the whole
// view on every token.
function applyFrame(state, f, started) {
  if (f.type === "retrieval") {
    Object.assign(state, { sources: f.sources, graph_path: f.graph_path, retrieval_ms: f.retrieval_ms, phase: "judging" });
    statusEl.textContent = `retrieval ${f.retrieval_ms} ms \u2014 judging whether these passages can answer\u2026`;
    render(state);
  } else if (f.type === "verdict") {
    Object.assign(state, { sufficient: f.sufficient, missing: f.missing,
      cited_chunk_ids: f.cited_chunk_ids, invalid_citations: f.invalid_citations,
      verdict_ms: f.verdict_ms, phase: f.sufficient ? "answering" : "refused" });
    statusEl.textContent = `retrieval ${state.retrieval_ms} ms \u2014 verdict ${f.verdict_ms} ms` +
      (f.sufficient ? " \u2014 answering\u2026" : " \u2014 insufficient");
    render(state);
  } else if (f.type === "delta") {
    state.answer += f.text;
    const el = document.getElementById("answerText");
    if (el) el.textContent = state.answer;
    else render(state);
  } else if (f.type === "done") {
    Object.assign(state, { answer: f.answer, truncated: f.truncated, refused: f.refused, phase: "done" });
    statusEl.textContent = `${((Date.now() - started) / 1000).toFixed(1)}s total \u2014 retrieval ${state.retrieval_ms} ms, ` +
      `verdict ${state.verdict_ms ?? 0} ms, answer ${f.answer_ms} ms`;
    render(state);
  } else if (f.type === "error") {
    statusEl.textContent = "";
    resultsEl.innerHTML = `<div class="panel"><span class="badge badge-err">error</span> ${esc(f.error)}</div>`;
  }
}

function render(d) {
  resultsEl.innerHTML = [answerPanel(d), graphPanel(d.graph_path), sourcesTable(d)].filter(Boolean).join("");
}

function answerPanel(d) {
  // Nothing to show until the verdict lands -- before that the honest state is
  // "still judging", not an empty answer box.
  if (d.phase === "retrieving" || d.phase === "judging") {
    return `<h2>Answer</h2><div class="panel"><span class="badge badge-plain">${esc(d.strategy)}</span>` +
      `<span class="badge badge-warn">judging sufficiency\u2026</span></div>`;
  }

  // A refusal is a correct outcome, not an error, and the hardest thing this
  // system does -- see KNOWN_LIMITATIONS.md. It gets the same visual weight as
  // an answer rather than being tucked away.
  const badges = [
    d.sufficient
      ? '<span class="badge badge-ok">answered from context</span>'
      : '<span class="badge badge-warn">not answerable from these passages</span>',
    d.truncated ? '<span class="badge badge-err">truncated</span>' : "",
    d.invalid_citations ? `<span class="badge badge-err">${d.invalid_citations} invalid citation(s)</span>` : "",
    `<span class="badge badge-plain">${esc(d.strategy)}</span>`,
    d.phase === "answering" ? '<span class="badge badge-plain">writing\u2026</span>' : "",
  ].join("");

  return `<h2>Answer</h2><div class="panel">${badges}` +
    `<div class="answer" id="answerText" style="margin-top:.5rem">${esc(d.answer)}</div></div>`;
}

function graphPanel(gp) {
  if (!gp) return ""; // naive: no traversal happened, nothing honest to show

  if (gp.fallback) {
    return `<h2>Graph path</h2>
      <div class="panel fallback">
        <span class="badge badge-warn">fell back to vector search</span>
        <div class="kv" style="margin-top:.4rem">${esc(gp.reason || "no anchor")}</div>
        <div class="kv muted">The graph contributed nothing to this answer. Everything below came from similarity search.</div>
      </div>`;
  }

  const ents = (gp.linked_entities || [])
    .map((e) => `<span class="badge badge-plain">${esc(e.name)} · ${e.mentions} mentions</span>`)
    .join("");

  // Only families that actually have variants are worth showing: a seed with
  // no siblings is just an entity, and listing it as a "family" would inflate
  // what coreference resolution did.
  //
  // Deduplicated by membership because je_same_as is symmetric and the question
  // often links several members of one family: asking about Alfredo Rodriguez
  // links both "Alfredo Rodriguez" and "Rodriguez", each of which reports the
  // other as its variant. That is one family seen from two ends, not two.
  const seenFamilies = new Set();
  const fams = (gp.families || [])
    .filter((f) => f.variants && f.variants.length)
    .filter((f) => {
      const key = [f.seed, ...f.variants].sort().join("␀");
      if (seenFamilies.has(key)) return false;
      seenFamilies.add(key);
      return true;
    })
    .map((f) => `<div class="family"><span class="seed">${esc(f.seed)}</span> <span class="variants">= ${f.variants.map(esc).join(" = ")}</span></div>`)
    .join("");

  return `<h2>Graph path</h2>
    <div class="panel anchored">
      <div class="kv"><b>Linked entities</b> (${esc(gp.link_mode)}): ${ents || '<span class="muted">none</span>'}</div>
      ${fams ? `<div class="kv" style="margin-top:.5rem"><b>Resolved as the same entity</b>${fams}</div>` : ""}
      <div class="kv" style="margin-top:.5rem">
        <b>${fmt(gp.reachable_mentions)}</b> mentions across
        <b>${fmt(gp.reachable_chunks)}</b> passages reachable by traversal;
        <b>${gp.nominated ?? gp.returned ?? "?"}</b> ${gp.nominated !== undefined ? "nominated into fusion" : "returned"}.
      </div>
      ${gp.pool_chunks !== undefined && gp.pool_chunks < gp.reachable_chunks ? `<div class="kv muted">Ranking considered ${fmt(gp.pool_chunks)} of those passages.</div>` : ""}
    </div>`;
}

/**
 * The mentions that reached this chunk, one line each.
 *
 * `mention_count` can exceed the number of entries shown: the retriever keeps
 * at most four per chunk, because a heavily mentioned entity can hit one
 * passage many times and this is held for the whole ranking pool. When it does,
 * say so rather than letting four look like all of them.
 */
function evidenceList(path) {
  const shown = path.evidence.length;
  const items = path.evidence.map((e) => {
    // 18,576 of 19,009 edges carry the literal string "none" as their role --
    // the extraction schema required the field and the model almost never had
    // grounds to fill it. Rendering "none" 97% of the time would bury the 433
    // edges where the role is real (plaintiff, defendant, counsel, judge,
    // witness, non_party), so it is shown only when it says something.
    const hasRole = e.role && e.role !== "none";
    const role = hasRole ? ` <span class="role">${esc(e.role)}</span>` : "";
    const quote = e.quote ? ` <span class="quote">\u201c${esc(e.quote)}\u201d</span>` : "";
    return `<li><span class="who">${esc(e.entity_name)}</span>${role}${quote}</li>`;
  });
  if (path.mention_count > shown) {
    items.push(`<li class="more">+ ${path.mention_count - shown} more mention(s) in this passage</li>`);
  }
  return `<ul class="ev">${items.join("")}</ul>`;
}

// Thousands separators. These counts are now genuinely large (a heavily
// mentioned entity reaches thousands of passages), and an unseparated five
// digit number in a demo reads as noise.
function fmt(n) {
  return typeof n === "number" ? n.toLocaleString("en-US") : "?";
}

function sourcesTable(d) {
  const cited = new Set(d.cited_chunk_ids || []);
  const rows = d.sources.map((s, i) => {
    const pages = s.page_start === s.page_end ? `p. ${s.page_start}` : `pp. ${s.page_start}–${s.page_end}`;
    // Two distinct facts, deliberately rendered as two lines.
    //
    // "reached via" is WHICH people the traversal matched in this passage.
    // The list under it is WHY -- the payload carried on each je_mentioned_in
    // edge: the role the extraction assigned, and the words it read to assign
    // it. That evidence is the concrete form of a claim this system makes
    // everywhere else in the abstract: evidence belongs to a mention, not to a
    // person, so merging two names can never overwrite it.
    const matched = s.path?.matched_entities?.length
      ? `<div class="chan">reached via ${s.path.matched_entities.map(esc).join(", ")}</div>`
      : "";
    const ev = s.path?.evidence?.length ? evidenceList(s.path) : "";
    const chan = s.channels ? `<div class="chan">${s.channels.map(esc).join(" ")}</div>` : "";
    return `<tr>
      <td class="num">${i + 1}</td>
      <td>${cited.has(s.chunk_id) ? '<span class="badge badge-ok">cited</span>' : ""}${esc(shortFile(s.source_file))}<br /><span class="muted">${pages}</span>${chan}${matched}${ev}</td>
      <td class="num">${s.distance === null ? '<span class="muted">—</span>' : s.distance.toFixed(3)}</td>
      <td><details><summary>text</summary><p>${esc(s.text)}</p></details></td>
    </tr>`;
  }).join("");

  // The legend only appears when channel tags are actually present. Naive
  // retrieval has one channel and tags nothing, so explaining four channels
  // there would describe machinery that did not run.
  const anyChannels = d.sources.some((s) => s.channels && s.channels.length);
  const legend = anyChannels
    ? `<p class="sub"><b>Channels.</b> Each tag is one retrieval channel and the rank it gave this chunk; several tags means several channels nominated it independently, which is the strongest signal available.<br />
        <code>vector#N</code> dense cosine similarity ·
        <code>density#N</code> documents with the most chunks in the pool ·
        <code>lexical#N</code> BM25 over the LLM-expanded query ·
        <code>graph#N</code> entity traversal over the knowledge graph ·
        <code>reserved</code> placed by rule, not by fusion — half the slots are guaranteed to plain cosine so that fusing channels can only add to vector search, never subtract from it.</p>`
    : "";

  return `<h2>Sources (${d.sources.length})</h2>
    <table>
      <thead><tr><th>#</th><th>Document</th><th>Distance</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="sub"><b>Distance.</b> Cosine distance, where the chunk was chosen by similarity. Chunks reached by graph traversal have none — they were selected by who is mentioned in them, not by how close they sit in vector space.</p>
    ${legend}`;
}
</script>

</body>
</html>
